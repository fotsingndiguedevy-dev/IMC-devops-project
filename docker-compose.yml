version: '3.9'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imc_user
      POSTGRES_PASSWORD: imc_password
      POSTGRES_DB: imc_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend Node.js
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://imc_user:imc_password@db:5432/imc_db
    depends_on:
      - db

  # Frontend (servi par Nginx)
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
